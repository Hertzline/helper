[workspace]
resolver = "2"
members = [
  "crates/hertzline-helper",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Hertzline/helper"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
